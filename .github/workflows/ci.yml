name: CI

on:
  pull_request:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  # A production run must never be cancelled mid-deploy: migrations may already be applied.
  cancel-in-progress: ${{ github.ref != 'refs/heads/production' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.0.0
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test -- --runInBand

      - name: Build
        run: pnpm build
      - name: Verify OpenAPI spec is current
        run: pnpm spec:generate -- --check

      - name: Lint OpenAPI spec
        run: pnpm spec:lint

  contract:
    name: Contract gate (breaking changes and version bump)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GITHUB_TOKEN }}
      REGISTRY_TOKEN_SOURCE: ${{ secrets.NPM_READ_TOKEN && 'NPM_READ_TOKEN' || 'GITHUB_TOKEN' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.0.0
          registry-url: https://npm.pkg.github.com
          scope: "@dauphaihau-camille"

      - name: Verify package registry access
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${NODE_AUTH_TOKEN}" \
            -H "Accept: application/vnd.npm.install-v1+json" \
            https://npm.pkg.github.com/@dauphaihau-camille%2Fapi-spec)"
          case "${STATUS}" in
            200) echo "Registry access verified." ;;
            401) echo "::error::Registry authentication failed (401). The credential from ${REGISTRY_TOKEN_SOURCE} is empty, expired, or not valid for GitHub Packages. Set NPM_READ_TOKEN to a token with read:packages for the dauphaihau-camille account." ; exit 1 ;;
            403) echo "::error::Registry access denied (403). The token is valid but cannot read @dauphaihau-camille/api-spec. Grant the package read access to dauphaihau-camille/api or set NPM_READ_TOKEN with read:packages." ; exit 1 ;;
            404) echo "::notice::Registry returned 404 for @dauphaihau-camille/api-spec. The package has not been published yet, so the contract gate will compare against no baseline and pass. After the first publication, a 404 here means the token cannot see the package, not that the package is missing." ;;
            *) echo "::error::Unexpected registry response HTTP ${STATUS}." ; exit 1 ;;
          esac

      - name: Check contract changes and version bump
        run: node api/scripts/check-contract-breaking.mjs
  e2e:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.0.0
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run e2e
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: pnpm exec jest --config ./test/jest-e2e.json --watchman=false --runInBand

  integration:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.0.0
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Start MinIO
        run: |
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=minio123 \
            cgr.dev/chainguard/minio@sha256:869ca3178831d9f521ea02258a0f0d4fbc1e9f84302e707514e1f861b860865d server /data

      - name: Wait for MinIO
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs minio
          exit 1

      - name: Run integration tests
        env:
          REDIS_URL: redis://127.0.0.1:6379
          REDIS_RATE_LIMIT_INT_TEST_URL: redis://127.0.0.1:6379
          BULLMQ_INT_TEST_REDIS_URL: redis://127.0.0.1:6379
          STORAGE_MINIO_ENDPOINT: http://127.0.0.1:9000
          STORAGE_MINIO_REGION: us-east-1
          STORAGE_MINIO_BUCKET: app-files
          STORAGE_MINIO_ACCESS_KEY: minio
          STORAGE_MINIO_SECRET_KEY: minio123
          STORAGE_MINIO_FORCE_PATH_STYLE: "true"
        run: pnpm test:int

      - name: Show MinIO logs on failure
        if: failure()
        run: docker logs minio

      - name: Stop MinIO
        if: always()
        run: docker rm -f minio

  # Render runs a prebuilt image and never migrates on boot. This job builds the
  # image, migrates from that exact image, and only then asks Render to deploy it.
  publish-image:
    needs: [validate, contract, e2e, integration]
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    concurrency:
      group: api-deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/dauphaihau-camille/api:${{ github.sha }}
            ghcr.io/dauphaihau-camille/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run database migrations
        timeout-minutes: 15
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID || secrets.INFISICAL_PROJECT_ID }}
        run: |
          if [ -z "${INFISICAL_TOKEN}" ] || [ -z "${INFISICAL_PROJECT_ID}" ]; then
            echo "::error::INFISICAL_TOKEN secret and INFISICAL_PROJECT_ID value are required"
            exit 1
          fi
          # Same image that is about to be deployed, different entrypoint.
          # The API accepts DATABASE_URL or DB_HOST/DB_PORT/DB_USER/DB_PASSWORD/DB_NAME,
          # so forward whichever set the prod environment defines.
          npx --yes @infisical/cli@0.43.100 run \
            --projectId="${INFISICAL_PROJECT_ID}" \
            --env=prod \
            --token="${INFISICAL_TOKEN}" \
            -- docker run --rm \
              -e DATABASE_URL -e DB_HOST -e DB_PORT -e DB_USER -e DB_PASSWORD -e DB_NAME \
              "ghcr.io/dauphaihau-camille/api:${GITHUB_SHA}" \
              pnpm db:migration:up

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # imgURL must be URL-encoded and match the service's image URL outside the tag.
          curl -sS --fail-with-body \
            "${RENDER_DEPLOY_HOOK_URL}&imgURL=ghcr.io%2Fdauphaihau-camille%2Fapi%3A${GITHUB_SHA}" \
            -w '\nHTTP %{http_code}\n'
