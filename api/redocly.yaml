# Redocly configuration for the generated OpenAPI document.
# Run with: pnpm spec:lint
extends:
  - recommended

rules:
  # High-value rules kept enabled explicitly so a future change to the
  # inherited ruleset cannot silently drop them from the gate.
  operation-4xx-response: warn
  operation-operationId: error

  # --- Exceptions required by the current document ---
  # `info.license` and the tag descriptions are emitted by `createApiDocument`
  # (`src/platform/docs/setup-api-docs.ts`); the entries below only record
  # warnings the generated document cannot satisfy.

  # `info.license.name` is `UNLICENSED` (matching the published manifest), and
  # an unlicensed private contract has no license URL to point at. The rule is
  # disabled so the document does not link a license that does not apply.
  info-license-strict: off

  # 78 errors: operations reference the `access_token` security scheme, but
  # the document declares `accessCookie`/`refreshCookie` instead. The bearer
  # scheme is applied by the global auth guard and is not emitted by the Nest
  # generator. Fixing this means renaming the schemes, which removes published
  # components, so it is out of scope for a documentation-only change.
  security-defined: off

  # `servers: []` is intentional: the document is consumed from a registry and
  # the server URL is environment-specific, so no default URL can be baked in.
  no-empty-servers: off

  # Four operations intentionally have no 2xx response because they are browser
  # redirects whose success status is `302` (`@ApiFoundResponse`):
  #   GET /v1/auth/oauth/google           -> Google consent screen
  #   GET /v1/auth/oauth/google/callback  -> back to the app, sets auth cookies
  #   GET /v1/auth/oauth/github           -> GitHub consent screen
  #   GET /v1/auth/oauth/github/callback  -> back to the app, sets auth cookies
  # This configuration format has no per-path rule overrides, so the rule is
  # disabled with the affected operations enumerated here rather than inventing
  # a success status the controllers never return.
  operation-2xx-response: off

  # Three components are deliberately kept although no operation links to them:
  #   - HealthCheckResponseDto: documented by the health controller, whose
  #     routes are served outside the `/v1` business prefix and are therefore
  #     dropped from `paths`; the schema stays in the published document and in
  #     the generated types.
  #   - accessCookie / refreshCookie: the session cookies are issued by the auth
  #     domain, but every controller declares `@ApiCookieAuth('access_token')`,
  #     so the generator never links the declared schemes. Removing them would
  #     drop published components, which is a breaking change, so they stay
  #     until the controllers and the published contract can move together.
  no-unused-components: off
